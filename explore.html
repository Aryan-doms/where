<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore cafes — WHERE?</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shared-layout.js" defer></script>
  <script src="user-ui.js" defer></script>
  <script src="explore.js" defer></script>
</head>
<body class="explore-page">
  <div data-where-header></div>
  <main class="explore-main">
    <div class="explore-heading">
      <p class="eyebrow">SURAT · CAFE GUIDE</p>
      <h1>All spots.</h1>
      <p>Find a place for your next coffee, meal, or slow afternoon.</p>
    </div>
    <form class="explore-searchbar" id="explore-filters">
      <label class="explore-search">
        <span class="visually-hidden">Search cafes</span>
        <input id="cafe-search" type="search" placeholder="Search cafes, areas or cuisines">
      </label>
      <label class="explore-select">
        <span class="visually-hidden">Filter by area</span>
        <select id="area-filter"><option value="">All areas</option></select>
      </label>
      <label class="explore-select">
        <span class="visually-hidden">Filter by cuisine</span>
        <select id="cuisine-filter"><option value="">All cuisines</option></select>
      </label>
    </form>
    <div class="explore-toolbar">
      <div class="explore-chips" id="explore-chips" aria-label="Quick area filters"></div>
      <p class="explore-count" id="explore-count" aria-live="polite"></p>
    </div>
    <div class="explore-grid" id="explore-grid"></div>
  </main>
  <div data-where-footer></div>
</body>
</html>
