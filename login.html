<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — WHERE?</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shared-layout.js" defer></script>
  <script src="user-ui.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-page" data-page="auth">
  <div data-where-header></div>
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Log in.</h1>
      <p class="auth-intro">Pick up where you left off.</p>
      <form id="login-form" class="auth-form">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button class="auth-submit" type="submit">Log in</button>
      </form>
      <p id="auth-message" class="auth-message" aria-live="polite"></p>
      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
  <div data-where-footer></div>
</body>
</html>
