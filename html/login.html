<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — WHERE?</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/shared-layout.js" defer></script>
  <script src="/js/user-ui.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body class="auth-page" data-page="auth">
  <div data-where-header></div>
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Log in.</h1>
      <p class="auth-intro">Pick up where you left off.</p>
      <form id="login-form" class="auth-form">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" placeholder="Enter username" required>
        <label for="login-password">Password</label>
        <div class="password-field-wrapper">
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" tabindex="-1">
            <svg class="eye-icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon-closed" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <button class="auth-submit" type="submit">Log in</button>
      </form>
      <p id="auth-message" class="auth-message" aria-live="polite"></p>
      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
