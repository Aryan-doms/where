<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your profile — WHERE?</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shared-layout.js" defer></script>
  <script src="user-ui.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-page" data-page="profile">
  <div data-where-header></div>
  <main class="auth-layout">
    <section class="profile-card" aria-labelledby="profile-title">
      <div class="profile-topline">
        <p class="eyebrow">Your somewhere</p>
        <button id="logout-button" class="text-button" type="button">Log out</button>
      </div>
      <div class="profile-image-wrap">
        <img id="profile-image" src="where.png" alt="Profile picture">
      </div>
      <h1 id="profile-title">@<span id="profile-username"></span></h1>
      <dl class="profile-details">
        <div><dt>Cafe hopping since</dt><dd><span id="profile-member-days"></span> days</dd></div>
        <div><dt>Phone</dt><dd id="profile-phone"></dd></div>
      </dl>
      <form id="profile-form" class="profile-form">
        <label for="profile-picture">Change profile picture</label>
        <input id="profile-picture" name="profile-picture" type="file" accept="image/*">
        <button class="auth-submit" type="submit">Save picture</button>
      </form>
      <p id="auth-message" class="auth-message" aria-live="polite"></p>
    </section>
    <section class="my-spots" aria-labelledby="my-spots-title">
      <div class="my-spots__heading">
        <p class="eyebrow">Saved for later</p>
        <h2 id="my-spots-title">My spots.</h2>
      </div>
      <div class="my-spots__list" id="my-spots-list"></div>
    </section>
  </main>
  <div data-where-footer></div>
</body>
</html>
