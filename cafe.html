<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Cafe details from the WHERE? Surat guide.">
  <title>Cafe — WHERE?</title>
  <link rel="stylesheet" href="styles.css">
  <script src="cafe-details.js" defer></script>
</head>
<body class="cafe-detail-page">
  <header class="site-header is-scrolled detail-header">
    <a class="brand-image brand-image--header" href="index.html" aria-label="WHERE? home">
      <img src="where.png" alt="WHERE?">
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html#cafe-types">Explore</a>
      <a href="index.html#areas">Areas</a>
      <a href="index.html#about">About</a>
    </nav>
    <a class="detail-header__back" href="index.html#featured">All spots</a>
  </header>

  <main class="cafe-detail-main">
    <a class="detail-back-link" href="index.html#featured">All spots</a>

    <section class="detail-hero" aria-labelledby="cafe-name" hidden>
      <div class="detail-hero__copy">
        <p class="detail-kicker"><span id="cafe-area"></span><span id="cafe-id"></span></p>
        <h1 id="cafe-name"></h1>
        <p class="detail-niche" id="cafe-niche"></p>
      </div>
      <div class="detail-price">
        <span class="detail-label">PRICE FOR TWO</span>
        <strong id="cafe-price"></strong>
        <span class="detail-price__note">approx.</span>
      </div>
      <figure class="detail-cover" id="cafe-cover" hidden>
        <img id="cafe-cover-image" alt="" fetchpriority="high">
      </figure>
    </section>

    <section class="detail-overview" aria-label="Cafe overview" hidden>
      <div class="detail-overview__vibe">
        <p class="detail-label">THE VIBE</p>
        <p id="cafe-vibe"></p>
      </div>
      <div class="detail-overview__cuisine">
        <p class="detail-label">ON THE MENU</p>
        <div class="detail-tags" id="cafe-cuisine"></div>
      </div>
    </section>

    <section class="detail-facts" aria-label="Cafe information" hidden>
      <div class="detail-fact">
        <p class="detail-label">FIND IT</p>
        <p id="cafe-location"></p>
      </div>
      <div class="detail-fact">
        <p class="detail-label">HOURS</p>
        <p id="cafe-timing"></p>
      </div>
      <div class="detail-fact">
        <p class="detail-label">CALL</p>
        <div id="cafe-contact"></div>
      </div>
      <div class="detail-fact">
        <p class="detail-label">GOOD TO KNOW</p>
        <div class="detail-tags" id="cafe-amenities"></div>
      </div>
    </section>

    <section class="detail-map-review" aria-label="Location and cafe notes" hidden>
      <div class="detail-map-card">
        <div class="detail-map" id="cafe-map" role="img">
          <span class="detail-map__block detail-map__block--one" aria-hidden="true"></span>
          <span class="detail-map__block detail-map__block--two" aria-hidden="true"></span>
          <span class="detail-map__block detail-map__block--three" aria-hidden="true"></span>
          <span class="detail-map__block detail-map__block--four" aria-hidden="true"></span>
          <span class="detail-map__park" aria-hidden="true"></span>
          <span class="detail-map__road detail-map__road--one" aria-hidden="true"></span>
          <span class="detail-map__road detail-map__road--two" aria-hidden="true"></span>
          <span class="detail-map__road detail-map__road--three" aria-hidden="true"></span>
          <span class="detail-map__road detail-map__road--four" aria-hidden="true"></span>
          <span class="detail-map__pin" aria-hidden="true"><span></span></span>
          <span class="detail-map__caption">LOCATION SKETCH · NOT TO SCALE</span>
        </div>
        <div class="detail-map-card__footer">
          <div>
            <p class="detail-label">FIND YOUR WAY</p>
            <p id="map-address"></p>
          </div>
          <a class="detail-directions" id="map-directions" target="_blank" rel="noopener noreferrer">
            Directions
          </a>
        </div>
      </div>

      <div class="detail-review" aria-label="Cafe description">
        <p class="detail-review__message" id="review-vibe"></p>
      </div>
    </section>

    <section class="detail-related" aria-labelledby="related-heading" hidden>
      <div class="detail-related__heading">
        <p class="detail-label" id="related-area"></p>
        <h2 id="related-heading">Close by.</h2>
      </div>
      <div class="detail-related__list" id="related-cafes"></div>
    </section>

    <p class="detail-error" id="detail-error" role="status" hidden></p>
  </main>

  <footer class="detail-footer">
    <a class="brand-image brand-image--footer" href="index.html" aria-label="WHERE? home">
      <img src="where.png" alt="WHERE?">
    </a>
    <a href="index.html#cafe-types">Back to exploring</a>
  </footer>
</body>
</html>
