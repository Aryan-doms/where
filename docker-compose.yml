services:
  mysql:
    image: mysql:8.4
    container_name: where-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cafecompass}
      MYSQL_USER: ${MYSQL_USER:-where}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-where_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-where_root_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - where_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  where_mysql_data:
